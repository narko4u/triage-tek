app = "triage-tek"
primary_region = "syd"

[build]

[env]
  SEL_DATA = "/data"
  SEL_DEMO_RESET_SECONDS = "1800"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

  [[http_service.checks]]
    interval = "30s"
    timeout = "3s"
    grace_period = "15s"
    method = "GET"
    path = "/api/summary"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
